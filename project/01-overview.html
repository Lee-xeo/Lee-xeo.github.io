<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>01 · 业务全景</title>
<style>
:root{
  --bg:#faf7f2;--bg-2:#f2ede4;--surface:#fffdfa;--surface-2:#f6f1e9;
  --border:rgba(64,50,36,.13);--border-strong:rgba(64,50,36,.22);
  --text:#2b2622;--muted:#6f665c;--muted-2:#9b9286;
  --clay:#c15f3c;--clay-2:#a64a2c;--clay-bright:#d97757;--clay-soft:#f4e7df;
  --gold:#bd8b3a;--gold-2:#9a6f27;--gold-soft:rgba(189,139,58,.10);
  --serif:"Songti SC","STSong","Noto Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
  --maxw:1000px;--topbar-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(1100px 620px at 80% -12%,rgba(217,119,87,.10),transparent 62%),
  radial-gradient(900px 560px at 4% 2%,rgba(189,139,58,.07),transparent 58%),
  linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px;width:100%}
.page-main{padding-top:calc(var(--topbar-h) + 52px);padding-bottom:80px;display:flex;flex-direction:column;min-height:100vh}
.page-main > .wrap{margin:auto;min-width:0}
@media(max-width:640px){.page-main{padding-top:calc(var(--topbar-h) + 32px)}}

h1.title{font-family:var(--serif);font-size:clamp(33px,5vw,54px);line-height:1.14;letter-spacing:-.01em;font-weight:700;margin-bottom:22px}
.lede{color:var(--muted);font-size:clamp(15px,1.7vw,18px);max-width:66ch}
.lede b{color:var(--text);font-weight:650}
.accent{color:var(--clay)}
.badge{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;
  color:var(--clay);background:var(--clay-soft);border:1px solid var(--border-strong);
  padding:7px 14px;border-radius:999px;margin-bottom:24px}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--clay-bright);box-shadow:0 0 9px rgba(217,119,87,.7);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.meta-row{display:flex;gap:10px 22px;flex-wrap:wrap;font-size:13.5px;color:var(--muted-2);font-family:var(--mono);margin-top:26px}
.meta-row span{display:inline-flex;align-items:center;gap:7px}
.meta-row span::before{content:"◆";color:var(--clay-bright);font-size:9px}

/* topbar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:60;height:var(--topbar-h);
  display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 26px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  background:rgba(250,247,242,.8);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:14px;letter-spacing:.01em;line-height:1.15;flex-shrink:0}
.mark{width:27px;height:27px;flex-shrink:0;border-radius:8px;background:var(--clay);display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;font-size:15px;color:#fff;box-shadow:0 3px 12px rgba(193,95,60,.4)}
.brand small{color:var(--muted-2);font-weight:500}
.dots{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.dot-btn{font-family:var(--mono);font-size:12px;color:var(--muted-2);background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:6px 11px;line-height:1;text-decoration:none;
  transition:color .2s,background .2s,border-color .2s,box-shadow .2s}
.dot-btn:hover{color:var(--text);border-color:var(--border-strong)}
.dot-btn.on{color:#fff;background:var(--clay);border-color:transparent;box-shadow:0 3px 12px rgba(193,95,60,.32)}
@media(max-width:640px){.topbar{padding:0 12px;gap:10px}.brand small{display:none}.brand .bl{display:none}
  .dots{gap:5px}.dot-btn{padding:5px 8px;font-size:11px}}

/* progress */
.progress{position:fixed;top:var(--topbar-h);left:0;right:0;height:3px;background:rgba(64,50,36,.08);z-index:59}
.progress>i{display:block;height:100%;background:var(--clay-bright)}

/* chapter nav */
.chapter-next{margin-top:72px;padding-top:32px;border-top:1px solid var(--border);text-align:center}
.next-btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;
  letter-spacing:.04em;color:var(--clay);text-decoration:none;background:transparent;
  border:1px solid rgba(193,95,60,.35);border-radius:999px;padding:9px 20px;
  transition:background .2s,border-color .2s,transform .18s}
.next-btn:hover{background:var(--clay-soft);border-color:var(--clay);transform:translateY(-1px)}

/* reveal */
[data-reveal]{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
[data-reveal].in{opacity:1;transform:none}
[data-reveal][data-d="1"]{transition-delay:.08s}
[data-reveal][data-d="2"]{transition-delay:.16s}
[data-reveal][data-d="3"]{transition-delay:.24s}
@media(prefers-reduced-motion:reduce){[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<div class="bg"></div>

<header class="topbar">
  <div class="brand">
    <span class="mark">L</span>
    <span>NJU&#8209;LINK LAB<br class="bl"><small>南京大学 · AI 教育团队</small></span>
  </div>
    <nav class="dots" aria-label="章节导航">
    <a class="dot-btn on" href="01-overview.html" title="团队内部 BP">01</a>
    <a class="dot-btn" href="02-two-tracks.html" title="一个方向，两条路">02</a>
    <a class="dot-btn" href="03-toc.html" title="to-C · Vibe Learning">03</a>
    <a class="dot-btn" href="04-tob.html" title="to-B · 多角色平台">04</a>
    <a class="dot-btn" href="05-nju.html" title="南大 · 起点">05</a>
    <a class="dot-btn" href="06-interplay.html" title="两端交互">06</a>
    <a class="dot-btn" href="07-roadmap.html" title="时间线 · 里程碑">07</a>
  </nav>
</header>
<div class="progress"><i style="width:14.3%"></i></div>

<main class="page-main">
  <div class="wrap">
    <div class="badge" data-reveal><span class="dot"></span>团队内部 BP</div>
    <h1 class="title" data-reveal data-d="1">我们到底在做<span class="accent">一门什么样的生意</span></h1>

    <p class="lede" style="margin-top:14px" data-reveal data-d="2">总的来说，我们有两条业务线：<b>C 端</b> 和 <b>B 端</b>。它们的客户不同、产品形态不同、商业模式不同，但底层的开发逻辑和团队本身是共享的。</p>
    <p class="lede" style="margin-top:14px" data-reveal data-d="2">以下信息涉及到团队内部信息，还请您<b>不要随意转发、传播或在公共平台讨论</b>，非常感谢。</p>

    <div class="meta-row" data-reveal data-d="3">
      <span>两条产品线</span>
      <span>一套认知引擎</span>
      <span>增强 · 与 · 替代</span>
    </div>

    <div class="chapter-next" data-reveal>
      <a class="next-btn" href="02-two-tracks.html">往下读 · 一个底座，两条路 →</a>
    </div>
  </div>
</main>

<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce) return;
  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('in'); });
  },{threshold:0.1});
  document.querySelectorAll('[data-reveal]').forEach(function(el){ obs.observe(el); });
})();
</script>
</body>
</html>
